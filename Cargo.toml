[package]
name = "tool14"
version = "0.2.0"
edition = "2024"

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
binrw = "0.15.2"
clap = { version = "4.6.7", features = ["derive"] }
config = { version = "0.15.25", features = ["json"] }
ironworks = { git = "https://github.com/WorkingRobot/ironworks", version = "0.4.1", features = ["excel", "sestring", "sqpack", "cutb", "tmb"] }
levenshtein = "1.0.5"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["cache"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json = "1.0.151"
time = "0.3.55"
